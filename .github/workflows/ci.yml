name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    # Keep push events unfiltered: a `release:` commit must be able to trigger
    # publishing even when the release itself does not change source files.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example v0.2.0); defaults to v<VERSION>'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  native-build:
    name: Native build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-24.04
            duckdb-platform: linux_amd64
            vcpkg-triplet: x64-linux
          - classifier: osx-aarch64
            os: macos-14
            duckdb-platform: osx_arm64
            vcpkg-triplet: arm64-osx
          - classifier: windows-x86_64
            # Keep the release CI on the known-good MSVC 2022 toolchain. The
            # DuckDB community preflight exercises its own current toolchains.
            os: windows-2022
            duckdb-platform: windows_amd64
            vcpkg-triplet: x64-windows-static
    env:
      NATIVE_VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg-native-deps
      NATIVE_MANIFEST_ROOT: ${{ github.workspace }}/vcpkg/native-deps
      NATIVE_INSTALL_ROOT: ${{ github.workspace }}/vcpkg/native-deps/vcpkg_installed
      VCPKG_FEED_URL: https://nuget.pkg.github.com/edigonzales/index.json
      VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/edigonzales/index.json,read
      VCPKG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure MSVC command environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Check out pinned vcpkg for native dependencies
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg-native-deps
          persist-credentials: false

      - name: Configure DuckDB vcpkg environment
        shell: bash
        run: |
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_INSTALLATION_ROOT is not available on this runner" >&2
            exit 1
          fi
          echo "VCPKG_TOOLCHAIN_PATH=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          native_deps_prefix="$NATIVE_INSTALL_ROOT/${{ matrix.vcpkg-triplet }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            native_deps_prefix="$(cygpath -m "$native_deps_prefix")"
          fi
          echo "NATIVE_DEPS_PREFIX=$native_deps_prefix" >> "$GITHUB_ENV"

      - name: Bootstrap pinned native-dependency vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: '"$NATIVE_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Bootstrap pinned native-dependency vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:NATIVE_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Install Mono for NuGet (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes mono-complete
          fi

      - name: Install Mono for NuGet (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v mono >/dev/null 2>&1; then
            brew install mono
          fi

      - name: Authenticate GitHub Packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NUGET_PATH="$("$NATIVE_VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
          mono "$NUGET_PATH" sources add \
            -Source "$VCPKG_FEED_URL" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "$GITHUB_ACTOR" \
            -Password "$VCPKG_GITHUB_TOKEN"

      - name: Authenticate GitHub Packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nuget = (& "$env:NATIVE_VCPKG_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1)
          & $nuget sources add `
            -Source "$env:VCPKG_FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:GITHUB_ACTOR" `
            -Password "$env:VCPKG_GITHUB_TOKEN"

      - name: Restore immutable native dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$NATIVE_VCPKG_ROOT/vcpkg" install \
            --triplet "${{ matrix.vcpkg-triplet }}" \
            --x-manifest-root="$NATIVE_MANIFEST_ROOT" \
            --x-install-root="$NATIVE_INSTALL_ROOT" \
            --only-binarycaching

      - name: Restore immutable native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:NATIVE_VCPKG_ROOT\vcpkg.exe" install `
            "--triplet=${{ matrix.vcpkg-triplet }}" `
            "--x-manifest-root=$env:NATIVE_MANIFEST_ROOT" `
            "--x-install-root=$env:NATIVE_INSTALL_ROOT" `
            --only-binarycaching
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build focused native Release targets
        shell: bash
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb-platform }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export GEN=ninja
            msvc_bin="$(dirname "$(command -v cl.exe)")"
            export PATH="$msvc_bin:$PATH"
          fi
          # The fast project CI restores immutable iox/ilic packages above.
          # Disable root manifest installation here, but rely on VCPKG_BUILD to
          # select the same installed-package CMake path used by community CI.
          make ci_release \
            VCPKG_TOOLCHAIN_PATH="$VCPKG_TOOLCHAIN_PATH" \
            VCPKG_TARGET_TRIPLET="${{ matrix.vcpkg-triplet }}" \
            EXT_RELEASE_FLAGS="-DVCPKG_MANIFEST_MODE=OFF -DCMAKE_PREFIX_PATH=$NATIVE_DEPS_PREFIX -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" \
            DISABLE_SANITIZER=1

      - name: Run native SQLLogicTests
        shell: bash
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb-platform }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make test_release GEN=ninja
          else
            make test_release
          fi

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Collect extension artifact
        shell: bash
        run: |
          mkdir -p "artifact/${{ matrix.classifier }}"
          cp build/release/extension/interlis/interlis.duckdb_extension "artifact/${{ matrix.classifier }}/interlis.duckdb_extension"
          shasum -a 256 "artifact/${{ matrix.classifier }}/interlis.duckdb_extension" > "artifact/${{ matrix.classifier }}/interlis.duckdb_extension.sha256" || \
            sha256sum "artifact/${{ matrix.classifier }}/interlis.duckdb_extension" > "artifact/${{ matrix.classifier }}/interlis.duckdb_extension.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: interlis-${{ matrix.classifier }}
          path: artifact/${{ matrix.classifier }}

  deploy:
    name: Deploy extension repository
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    needs: native-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: interlis-*
          merge-multiple: false

      - name: Organize repository tree
        shell: bash
        run: |
          mkdir -p repo/v1.5.5/{osx_arm64,linux_amd64,windows_amd64}
          declare -A PLATFORM_MAP=(
            [linux-x86_64]=linux_amd64
            [osx-aarch64]=osx_arm64
            [windows-x86_64]=windows_amd64
          )
          for dir in interlis-*/; do
            classifier="${dir#interlis-}"
            classifier="${classifier%/}"
            platform="${PLATFORM_MAP[$classifier]}"
            cp "$dir/interlis.duckdb_extension" "repo/v1.5.5/$platform/"
          done

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: repo/*
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          rm: false

  release:
    name: Create GitHub Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${DISPATCH_RELEASE_TAG:-}" ]; then
            tag="$DISPATCH_RELEASE_TAG"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: interlis-*
          merge-multiple: false

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for classifier in linux-x86_64 osx-aarch64 windows-x86_64; do
            source="interlis-${classifier}/interlis.duckdb_extension"
            target="release-assets/interlis-${classifier}.duckdb_extension"
            cp "$source" "$target"
            sha256sum "$target" > "${target}.sha256"
          done

      - name: Remove legacy ambiguous release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release delete-asset "$RELEASE_TAG" interlis.duckdb_extension --yes || true
          gh release delete-asset "$RELEASE_TAG" interlis.duckdb_extension.sha256 --yes || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: release-assets/*
          generate_release_notes: true
