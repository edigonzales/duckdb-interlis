name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  native-build:
    name: Native build (${{ matrix.classifier }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-24.04
            duckdb-platform: linux_amd64
          - classifier: linux-aarch64
            os: ubuntu-24.04-arm
            duckdb-platform: linux_arm64
          - classifier: osx-aarch64
            os: macos-15
            duckdb-platform: osx_arm64
          - classifier: windows-x86_64
            # DuckDB 1.5.3's vendored fmt still uses stdext::checked_array_iterator,
            # which was removed from the Visual Studio 2026 toolchain.
            os: windows-2022
            duckdb-platform: windows_amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure vcpkg environment
        shell: bash
        run: |
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_INSTALLATION_ROOT is not available on this runner" >&2
            exit 1
          fi
          echo "VCPKG_TOOLCHAIN_PATH=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Build native Release extension
        shell: bash
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb-platform }}
        run: |
          make release \
            VCPKG_TOOLCHAIN_PATH="$VCPKG_TOOLCHAIN_PATH" \
            DISABLE_SANITIZER=1

      - name: Run native SQLLogicTests
        shell: bash
        run: make test_release

      - name: Collect extension artifact
        shell: bash
        run: |
          mkdir -p "artifact/${{ matrix.classifier }}"
          cp build/release/extension/interlis/interlis.duckdb_extension "artifact/${{ matrix.classifier }}/interlis.duckdb_extension"
          shasum -a 256 "artifact/${{ matrix.classifier }}/interlis.duckdb_extension" > "artifact/${{ matrix.classifier }}/interlis.duckdb_extension.sha256" || \
            sha256sum "artifact/${{ matrix.classifier }}/interlis.duckdb_extension" > "artifact/${{ matrix.classifier }}/interlis.duckdb_extension.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: interlis-${{ matrix.classifier }}
          path: artifact/${{ matrix.classifier }}

  deploy:
    name: Deploy extension repository
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: native-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: interlis-*
          merge-multiple: false

      - name: Organize repository tree
        shell: bash
        run: |
          mkdir -p repo/v1.5.3/{osx_arm64,linux_amd64,linux_arm64,windows_amd64}
          declare -A PLATFORM_MAP=(
            [linux-x86_64]=linux_amd64
            [linux-aarch64]=linux_arm64
            [osx-aarch64]=osx_arm64
            [windows-x86_64]=windows_amd64
          )
          for dir in interlis-*/; do
            classifier="${dir#interlis-}"
            classifier="${classifier%/}"
            platform="${PLATFORM_MAP[$classifier]}"
            cp "$dir/interlis.duckdb_extension" "repo/v1.5.3/$platform/"
          done

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: repo/*
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          rm: false

  release:
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: interlis-*
          merge-multiple: false

      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            interlis-linux-x86_64/interlis.duckdb_extension
            interlis-linux-x86_64/interlis.duckdb_extension.sha256
            interlis-linux-aarch64/interlis.duckdb_extension
            interlis-linux-aarch64/interlis.duckdb_extension.sha256
            interlis-osx-aarch64/interlis.duckdb_extension
            interlis-osx-aarch64/interlis.duckdb_extension.sha256
            interlis-windows-x86_64/interlis.duckdb_extension
            interlis-windows-x86_64/interlis.duckdb_extension.sha256
          generate_release_notes: true
